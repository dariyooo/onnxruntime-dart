# Workspace root. Holds no code.
#
# The ONNX Runtime submodule and the CI that builds it are shared by every
# package here, so they live above the members rather than inside one.
name: _onnxruntime_dart_workspace
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/onnxruntime_dart

# Development only, and never published: this file is the workspace root, not a
# package. Points the build hook at a locally extracted ONNX Runtime so the
# package can be worked on before any binaries are released.
hooks:
  user_defines:
    onnxruntime_dart:
      local_build: .local/ort/onnxruntime-osx-arm64-1.29.0/lib
