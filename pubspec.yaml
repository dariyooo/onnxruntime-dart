# Workspace root. Holds no code.
#
# The ONNX Runtime submodule and the CI that builds it are shared by every
# package here, so they live above the members rather than inside one.
name: _onnxruntime_dart_workspace
publish_to: none

environment:
  sdk: ^3.6.0

workspace:
  - packages/onnxruntime_dart
  - packages/onnxruntime_hook
  - packages/onnxruntime_binaries
  - packages/onnxruntime_extensions
  - packages/onnxruntime_extensions_binaries
  - packages/onnxruntime_genai
  - packages/onnxruntime_genai_binaries
  - packages/onnxruntime_ep_webgpu
  - packages/onnxruntime_ep_webgpu_binaries
  - packages/onnxruntime_ep_cuda
  - packages/onnxruntime_ep_cuda_binaries
  - packages/onnxruntime_ep_qnn
  - packages/onnxruntime_ep_qnn_binaries

# The Flutter packages are deliberately not members, and this is a choice
# rather than a limitation: a workspace resolved by Flutter's own Dart handles
# them fine.
#
# The point is that CI resolves this workspace with standalone Dart. Nothing
# published here needs Flutter, and testing with a Dart that has no Flutter to
# fall back on is what keeps that true. A Flutter member would force every job
# to install Flutter, and the guarantee would stop being checked.
#
# Flutter resolves them itself, the same way it resolves integration/harness.

# Development only, and never published: this file is the workspace root, not a
# package. Points the runtime packages at a local ONNX Runtime so they can be
# worked on before any binaries are released. This is our own CI build, not a
# published Microsoft one, so the operator coverage tests mean what they claim.
#
# Only the base package is pointed anywhere, so the probe in runtime.dart finds
# exactly one runtime and the tests run against a known library.
#
# The path below is a placeholder. In CI, locate_library.py rewrites this line
# to whatever the job unpacked, which is how the tests get a native asset at
# all: without one the generated bindings resolve nothing and every
# session-level test skips. Locally, point it at your own build, or leave it
# and let the build hook install from the release.
hooks:
  user_defines:
    onnxruntime_binaries:
      local_build: .local/ort/current/lib
