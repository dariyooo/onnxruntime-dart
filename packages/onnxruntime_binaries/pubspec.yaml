name: onnxruntime_binaries
description: >-
  The ONNX Runtime shared library for onnxruntime_dart. Every operator and
  every execution provider we build, with on-device training available as a
  variant. The package version is the ONNX Runtime version it installs.
# The version IS the ONNX Runtime version. Depend on 1.29.1 to run on 1.29.1.
# No Dart API lives here; the bindings are in onnxruntime_dart.
version: 1.29.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  # 3.10 because this package uses build hooks: code_assets and hooks both
  # require it, so ^3.6.0 advertised a floor the package could not meet and a
  # user on 3.6 to 3.9 got a resolution failure naming a transitive package
  # rather than the real requirement.
  sdk: ^3.10.0

resolution: workspace

dependencies:
  code_assets: '>=1.0.0 <2.0.0'
  hooks: '>=1.0.0 <3.0.0'
  onnxruntime_hook: ^0.1.0
