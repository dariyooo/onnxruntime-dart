name: onnxruntime_ep
description: >-
  Execution provider plugins for onnxruntime_dart. Choose which accelerators to
  install and only those are downloaded and bundled.
# The version IS the ONNX Runtime version these providers were built from, and
# must match the runtime package installed alongside them.
version: 1.29.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  code_assets: ^1.2.1
  hooks: ^2.2.0
  # The shared build hook. Not onnxruntime_dart: that package dev-depends on
  # this one, and the hook runner refuses a cycle.
  onnxruntime_hook: ^1.29.0
