name: onnxruntime_hook
description: >-
  The build hook shared by the packages that install ONNX Runtime binaries.
  Not needed to use onnxruntime_dart; it is a build-time dependency of
  onnxruntime_binaries, onnxruntime_binaries and onnxruntime_ep.
# Versioned with the binaries it installs, so the release it downloads from is
# named by the depending package's own version.
version: 1.29.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  # Verifying the SHA-256 published beside every release asset.
  crypto: ^3.0.0
  # Wide on purpose. Newer hooks pull in record_use, which pins a meta newer
  # than the one Flutter's SDK ships, and a build hook that cannot resolve
  # inside a Flutter app is a build hook nobody on Flutter can use.
  code_assets: '>=1.0.0 <2.0.0'
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
