name: onnxruntime_hook
description: >-
  The build hook shared by the packages that install ONNX Runtime binaries. Not
  needed to use onnxruntime_dart, which depends on it indirectly.
# Versioned as itself, not as the binaries. It installs several components at
# several upstream versions, so there is no single version it could carry, and
# the release each package downloads from is named by that package's version.
version: 0.1.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  # 3.10 because this package uses build hooks: code_assets and hooks both
  # require it, so ^3.6.0 advertised a floor the package could not meet and a
  # user on 3.6 to 3.9 got a resolution failure naming a transitive package
  # rather than the real requirement.
  sdk: ^3.10.0

resolution: workspace

dependencies:
  # Verifying the SHA-256 published beside every release asset.
  crypto: ^3.0.0
  # Wide on purpose. Newer hooks pull in record_use, which pins a meta newer
  # than the one Flutter's SDK ships, and a build hook that cannot resolve
  # inside a Flutter app is a build hook nobody on Flutter can use.
  code_assets: '>=1.0.0 <2.0.0'
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
