# Regenerate with:  dart run ffigen
#
# Headers come from the pinned GenAI submodule (third_party/onnxruntime-genai,
# 0.15.2). The submodule is the single source of truth: the generated bindings
# must always correspond to the commit it points at.
name: GenAiBindings
description: Generated ONNX Runtime GenAI C API bindings (0.15.2).
output: 'lib/src/bindings/genai_bindings.g.dart'

headers:
