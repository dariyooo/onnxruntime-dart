name: onnxruntime_ep_webgpu
description: >-
  The webgpu execution provider for onnxruntime_dart. GPU compute through WebGPU, which reaches Vulkan, D3D12 and Metal.
# The API's own version. The build metadata names the binary it was
# written against, which is a different thing from the one an
# application chooses to run: that is the _binaries package.
version: 0.1.0+webgpu-0.3.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  sdk: ^3.6.0

resolution: workspace
dependencies:
  onnxruntime_dart: ^0.1.0
  # The oldest runtime this plugin works against, from its own
  # MIN_ONNXRUNTIME_VERSION. ONNX Runtime compiles that into the library and
  # refuses to load below it, so declaring it here turns a runtime failure into
  # one pub reports before anything is downloaded.

# onnxruntime_ep_webgpu_binaries is deliberately not a dependency. The asset this
# package is declared against is installed by that package, and naming it
# here would make it compulsory. Leaving it out is what lets an
# application pick a build, or take none and supply the library itself at
# run time. onnxruntime_dart does the same with onnxruntime_binaries.
