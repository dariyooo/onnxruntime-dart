name: onnxruntime_ep_webgpu_binaries
description: >-
  Prebuilt the WebGPU execution provider plugin for onnxruntime_dart, installed as a code asset. The API lives in onnxruntime_ep_webgpu.
# The binary's own version, unchanged by this package existing. It is separate
# from the API so that an application can move one without the other.
version: 0.3.0
repository: https://github.com/dariyooo/onnxruntime-dart
issue_tracker: https://github.com/dariyooo/onnxruntime-dart/issues

environment:
  # 3.10 because this package uses build hooks: code_assets and hooks both
  # require it, so ^3.6.0 advertised a floor the package could not meet and a
  # user on 3.6 to 3.9 got a resolution failure naming a transitive package
  # rather than the real requirement.
  sdk: ^3.10.0

resolution: workspace

dependencies:
  code_assets: '>=1.0.0 <2.0.0'
  hooks: '>=1.0.0 <3.0.0'
  onnxruntime_hook: ^0.1.0
  # The oldest runtime this plugin works against, from its own
  # MIN_ONNXRUNTIME_VERSION. ONNX Runtime compiles that into the library and
  # refuses to load below it, so declaring it here turns a runtime failure into
  # one pub reports before anything is downloaded.
  onnxruntime_binaries: '>=1.24.4 <2.0.0'
