# Regenerate with:  dart run ffigen
#
# Headers come from the pinned ORT submodule (third_party/onnxruntime, v1.29.0,
# ORT_API_VERSION 29). The submodule is the single source of truth: the generated
# bindings must always correspond to the commit it points at.
name: OrtBindings
description: Generated ONNX Runtime C API bindings (ORT_API_VERSION 29).
output: 'lib/src/bindings/ort_bindings.g.dart'

headers:
  entry-points:
    - '../../third_party/onnxruntime/include/onnxruntime/core/session/onnxruntime_c_api.h'
    - '../../third_party/onnxruntime/include/onnxruntime/core/providers/coreml/coreml_provider_factory.h'
    - '../../third_party/onnxruntime/include/onnxruntime/core/providers/cpu/cpu_provider_factory.h'
    # On-device training. A separate header, and separately compiled: only the
    # `full` build has it, and GetTrainingApi returns null without it. Binding
    # it here costs nothing in a build that lacks it.
    - '../../third_party/onnxruntime/orttraining/orttraining/training_api/include/onnxruntime_training_c_api.h'
  include-directives:
    - '**onnxruntime_c_api.h'
    - '**onnxruntime_training_c_api.h'
    - '**coreml_provider_factory.h'
    - '**cpu_provider_factory.h'

compiler-opts:
  - '-I../../third_party/onnxruntime/include/onnxruntime/core/session'

# C enum width is implementation-defined; ffigen warns on every one of them.
silence-enum-warning: true

macros:
  exclude:
    # ORT_FILE expands to __FILE__ (onnxruntime_c_api.h:131). ffigen evaluates
    # macros inside a generated temp .hpp, so __FILE__ resolves to that throwaway
    # path -- which is both machine-specific and different on every run, breaking
    # byte-for-byte reproducibility of the committed bindings.
    - 'ORT_FILE'

preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  //
  // Generated by package:ffigen from the ORT submodule pinned in
  // third_party/onnxruntime. Regenerate with `dart run ffigen`.
  //
  // ignore_for_file: type=lint, camel_case_types, non_constant_identifier_names
  // ignore_for_file: unused_field, unused_element, doc_directive_unknown
