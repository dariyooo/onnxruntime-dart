# Builds the base ONNX Runtime shared library for every supported configuration.
#
# Three rules shape this file:
#
#   1. Builds are complete. Every operator, every opset, all contrib ops, on
#      every platform. ort_matrix.py fails the build if a flag would trim them.
#   2. The source is the pinned submodule, never a downloaded tarball, so a
#      green build is reproducible from one commit.
#   3. x86 and arm64 on every platform that has both.
#
# Standard runners are free and unlimited on public repositories, so breadth
# costs nothing. Only -large and -xlarge are billed and none are used.
name: build-runtime

on:
  workflow_call:
    inputs:
      configurations:
        description: 'Subset to build (regex over the id field), or "all"'
        type: string
        default: all
  workflow_dispatch:
    inputs:
      configurations:
        description: 'Subset to build (regex over the id field), or "all"'
        type: string
        default: all
  push:
    tags: ['v*']
  pull_request:
    # A Dart-only change cannot break the native build, so do not spend an hour
    # proving it. Anything that can break it does run the full matrix.
    paths:
      - '.github/workflows/build-runtime.yml'
      - '.gitmodules'
      - 'third_party/onnxruntime'

permissions:
  contents: read

concurrency:
  group: build-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ORT_BUILD_CONFIG: Release

jobs:
  # Resolves the matrix once so the same list drives both the build and the
  # release fan-in, and a subset can be requested without editing the file.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          FILTER: ${{ inputs.configurations || 'all' }}
        run: python3 .github/scripts/plan_matrix.py >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      # One configuration failing must not hide the state of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MATRIX_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Report the exact source commit
        shell: bash
        run: |
          cd third_party/onnxruntime
          echo "ORT $(cat VERSION_NUMBER) at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          # Never restore the NDK from the Actions cache. The cache does not
          # preserve its symlinks and executable bits, so a restored copy is
          # missing the clang binaries and CMake fails to find a compiler. The
          # first run works and every later one breaks. Downloading is ~1 minute
          # and is paid once now that all four ABIs share this job.
          local-cache: false

      # WebGPU and WebNN both force `-s ASYNCIFY=1`, and that link needs more
      # than 39 GB: measured, it fills the runner's 16 GB in forty seconds and
      # then consumes swap at ~4.6 GB/min until there is none left. What it
      # looks like from outside is the runner vanishing mid-link, or make
      # losing a child with no exit status, neither of which says "memory".
      #
      # So take most of the ephemeral disk. Swapping is slow, and finishing
      # slowly is the whole point.
      - name: Give the linker room
        if: matrix.platform == 'web'
        run: |
          set -euo pipefail
          # /mnt is the runner's large ephemeral disk. The root volume is
          # where the build tree goes, so taking swap from it trades one
          # failure for another.
          # Written with sudo, so its ownership does not matter, only that it
          # is there.
          target=/mnt
          [ -d "$target" ] || target=/
          available=$(df --output=avail -BG "$target" | tail -1 | tr -dc '0-9')
          # Leave room for anything else that writes there, and cap the file at
          # a size mkswap handles comfortably.
          # Written as ifs, not `[ ] && x=y`: under `set -e` a false test is a
          # non-zero status and aborts the step.
          if [ "$available" -lt 24 ]; then
            echo "::warning::only ${available}G free on $target, skipping swap"
            free -h
            exit 0
          fi
          size=$(( available - 15 ))
          if [ "$size" -gt 64 ]; then size=64; fi
          echo "$target has ${available}G free; adding ${size}G of swap"

          sudo swapoff -a || true
          sudo rm -f "$target/ort-swapfile"
          sudo fallocate -l "${size}G" "$target/ort-swapfile"
          sudo chmod 600 "$target/ort-swapfile"
          sudo mkswap "$target/ort-swapfile"
          sudo swapon "$target/ort-swapfile"
          # Prefer swapping over being killed: the link is one long-lived
          # process and finishing slowly beats not finishing.
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Set up Emscripten
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgles2-mesa-dev

      # cmake/deps.txt vendors ~40 dependencies. Caching them is for latency, not
      # cost -- a cold fetch adds several minutes to every job in the matrix.
      - name: Cache ORT dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\deps' || '~/.onnxruntime_deps' }}
          key: ortdeps-${{ matrix.id }}-${{ hashFiles('third_party/onnxruntime/cmake/deps.txt') }}
          restore-keys: ortdeps-${{ matrix.id }}-

      - name: Key the artifact cache on the exact source and flags
        id: key
        shell: bash
        run: |
          ort=$(git -C third_party/onnxruntime rev-parse HEAD)
          flags=$(python3 -c "
          import sys, os; sys.path.insert(0, '.github/scripts')
          import ort_matrix, hashlib
          args = ' '.join(ort_matrix.by_id(os.environ['MATRIX_ID']).build_args())
          print(hashlib.sha256(args.encode()).hexdigest()[:16])
          ")
          echo "value=ort-${{ matrix.id }}-${ort:0:12}-$flags" >> "$GITHUB_OUTPUT"

      - name: Restore a previous build of this exact source
        id: cached
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ steps.key.outputs.value }}

      - name: Build
        if: steps.cached.outputs.cache-hit != 'true'
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ORT_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # The wasm link dies without saying why: sometimes make reports
          # "wait: No child processes", sometimes the runner itself goes away.
          # Both are what a kill looks like from the outside. Sampling from
          # inside this step puts the evidence in the live log, where it
          # survives the job being killed -- a later step would never run.
          if [ "${ORT_PLATFORM:-}" = "web" ]; then
            while true; do
              echo "[resources] $(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/ {print "mem="$3"/"$2"MB"}')" \
                "$(free -m | awk '/^Swap:/ {print "swap="$3"/"$2"MB"}')" \
                "rootfree=$(df -m --output=avail / | tail -1 | tr -d ' ')MB"
              sleep 20
            done &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
          fi
          python3 .github/scripts/build_runtime.py

      - name: Collect artifacts and SHA-256 sidecars
        if: steps.cached.outputs.cache-hit != 'true'
        shell: bash
        run: python3 .github/scripts/package_artifact.py

      - uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          # One day, not fourteen. These are read by the test job and the
          # release job in this same run and by nothing afterwards, so keeping
          # them for a fortnight stored a gigabyte per day of pushes for no
          # reader at all.
          retention-days: 1

  # Releasing is a fan-in. A partial matrix ships a package whose build hook
  # 404s on the platforms that failed, so every configuration must succeed
  # before anything is published.
  # Publishing is gated on the full matrix. A partial release ships a package
  # whose build hook 404s on the platforms that failed.
  release:
    name: publish release
    needs: [plan, build]
    # Moving the ONNX Runtime pin is what produces a release, so this runs on
    # main as well as on a hand-pushed tag. The name comes from the pin, and
    # the release is created once and refreshed after that, so re-running a
    # build that went wrong replaces its binaries rather than piling up tags.
    if: |
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      # One release per stream: the core library and each execution provider
      # plugin are installed independently.
      fail-fast: false
      matrix:
        component: [runtime, ep-webgpu]
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/download-artifact@v4
        with:
          pattern: onnxruntime-*
          path: artifacts
          merge-multiple: true

      - name: Select the component this release publishes
        id: component
        run: echo "name=${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      # A hand-pushed tag still wins, so a one-off release can be cut by name.
      # Otherwise the name is derived from the pinned ONNX Runtime: its version
      # when the pin sits on a release, its commit when it does not.
      - name: Name the release after the pinned ONNX Runtime
        id: identity
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "using the pushed tag ${{ github.ref_name }}"
          else
            python3 .github/scripts/release_identity.py \
              --component "${{ matrix.component }}"
          fi

      - name: Collect archives
        id: archives
        run: |
          set -euo pipefail
          component='${{ steps.component.outputs.name }}'
          mkdir -p "dist/$component"
          find artifacts -path "*/$component/*" \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} "dist/$component/" \;
          if [ "$component" = runtime ]; then
            python3 .github/scripts/package_headers.py
          fi
          if [ -z "$(ls -A "dist/$component")" ]; then
            echo "no archives for $component in this build; nothing to publish"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -la "dist/$component"

      - name: Pin the assets the build hook may install
        if: steps.component.outputs.name == 'runtime' && steps.archives.outputs.empty != 'true'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python3 .github/scripts/write_release_manifest.py
          echo '### Manifest to commit before publishing' >> "$GITHUB_STEP_SUMMARY"
          echo '```dart' >> "$GITHUB_STEP_SUMMARY"
          cat packages/onnxruntime_dart/lib/src/hook/release.g.dart >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.component.outputs.name == 'runtime' && steps.archives.outputs.empty != 'true'
        with:
          name: release-manifest
          retention-days: 1
          path: packages/onnxruntime_dart/lib/src/hook/release.g.dart

      # Created once, refreshed after that. Rebuilding a release that went
      # wrong replaces its binaries under the same name rather than leaving a
      # trail of tags that differ only in which one was any good.
      - name: Publish or refresh the release
        if: steps.archives.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMPONENT: ${{ steps.component.outputs.name }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="Prebuilt ONNX Runtime for every supported configuration, built"
          notes="$notes from $(git -C third_party/onnxruntime rev-parse HEAD)."
          notes="$notes Each archive is verified by the build hook against the"
          notes="$notes SHA-256 in its sidecar."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "refreshing $TAG"
            gh release upload "$TAG" dist/"$COMPONENT"/* --clobber
            gh release edit "$TAG" --notes "$notes"
          else
            echo "creating $TAG"
            flags=()
            if [ "$PRERELEASE" = true ]; then
              # Built from an ONNX Runtime that has no release of its own, so
              # it must not look like one.
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/"$COMPONENT"/* \
              --title "$TAG" --notes "$notes" "${flags[@]}"
          fi

  all-green:
    name: all ${{ needs.plan.outputs.count }} configurations succeeded
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build to have succeeded
        run: |
          result='${{ needs.build.result }}'
          echo "build matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Not every configuration built. A partial matrix must never be released."
            exit 1
          fi
