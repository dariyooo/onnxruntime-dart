# The pipeline.
#
# Two stages, because they answer different questions and cost different amounts.
#
#   1. Platform-independent checks and the pure-Dart suite. Fast, and covers the
#      assumptions that vary by platform: ORTCHAR_T width, pointer size on
#      32-bit Android ABIs, byte order, resident-memory reporting.
#   2. Build our own ONNX Runtime, then run the suite against it. The ABI tests
#      only mean something against the binary we ship. A published Microsoft
#      build would test an artifact we do not distribute, and would stay green
#      even if our own build were broken.
#
# Stage 2 caches each artifact by ORT commit and build flags, so it rebuilds
# only when the source or the flags actually change.
name: ci

on:
  push:
    # main only. Work on dev pushes as often as it likes without starting
    # anything; run it deliberately with the inputs below when there is
    # something worth running. Merging to main then runs all of it.
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      from_release:
        description: >-
          Skip building and test against a published release instead. Give a
          runtime tag, or "latest" for the one this checkout pins. Empty builds
          everything and tests what it built.
        type: string
        default: ''
      only:
        description: >-
          Run part of it. Comma separated, any of: runtime, full, webgpu, qnn,
          cuda, extensions, genai, desktop, device, web. Empty runs everything.
        type: string
        default: ''
  schedule:
    # Weekly, against what is published, so a release that stops installing is
    # noticed without waiting for someone to push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Superseding a run must not cancel the native build: it takes hours, and a run
# cancelled halfway leaves nothing cached, so a steady stream of pushes means it
# never finishes once. The fast jobs cancel per job instead, and the build has
# its own group in build-runtime.yml that queues rather than cancels.
jobs:
  # The only switch in this file. Everything downstream reads its output
  # rather than testing the input again, so there is one answer to "are we
  # building or testing what is already published" and no way for two jobs to
  # disagree about it.
  mode:
    name: build, or test what is published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      building: ${{ steps.pick.outputs.building }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - id: pick
        run: |
          set -euo pipefail
          asked='${{ inputs.from_release }}'
          if [ -z "$asked" ] && [ "${{ github.event_name }}" != schedule ]; then
            echo "building=true" >> "$GITHUB_OUTPUT"
            echo "release=" >> "$GITHUB_OUTPUT"
            echo "building everything and testing what was built"
            exit 0
          fi

          if [ -z "$asked" ] || [ "$asked" = latest ]; then
            asked=$(python3 -c "
          import sys; sys.path.insert(0, '.github/scripts')
          import release_identity
          print(release_identity.release_tag('runtime'))
          ")
          fi
          echo "building=false" >> "$GITHUB_OUTPUT"
          echo "release=$asked" >> "$GITHUB_OUTPUT"
          echo "skipping the builds and testing $asked"

      # Only when testing what is published. On a run that builds, the release
      # for a version just bumped does not exist yet and is about to be made.
      - name: Every component this checkout declares has a release
        if: ${{ steps.pick.outputs.building != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_releases_exist.py

  static:
    name: format, analyze, matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: static-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: dart pub get

      # dart format ignores analysis_options' formatter.exclude, so generated
      # files are filtered here. A check that examines nothing passes
      # vacuously, so fail when the glob finds none.
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          # integration/ too: it is Dart we maintain, and leaving it out
          # is how two files there drifted without anything noticing.
          files=$(find packages integration -name '*.dart' -not -name '*.g.dart')
          if [ -z "$files" ]; then
            echo "::error::found no Dart files to format-check"
            exit 1
          fi
          dart format --output=none --set-exit-if-changed $files

      - run: dart analyze --fatal-infos
      # The matrix tests read the workflow files to check that each thing that
      # ships has its own pipeline.
      - run: pip install pyyaml
      - run: python3 .github/scripts/test_matrix.py

      # The hook decides asset names, targets and builds, so drift here is a
      # download that never happens. Pure logic, no platform to vary, and it
      # gates the builds from the one job that runs before them.
      - name: Test the build hook
        run: dart test packages/onnxruntime_hook --reporter expanded

  # The Flutter packages sit outside the workspace and outside `dart analyze`,
  # which excludes them on the grounds that Flutter analyses them instead.
  # Nothing did. This is the job that makes that comment true.
  #
  # Separate from `static` because it needs Flutter, and the point of keeping
  # these out of the workspace is that the other jobs do not.
  analyze-flutter:
    name: analyze · flutter packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: analyze-flutter-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Analyze each one on its own
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/onnxruntime_web \
                     packages/onnxruntime_web_webgpu \
                     packages/onnxruntime_web_webgpu_webnn \
                     integration/harness; do
            echo "::group::$dir"
            ( cd "$dir" && flutter pub get && flutter analyze )
            echo "::endgroup::"
          done

  bindings-are-current:
    name: bindings match the submodule
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: bindings-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - working-directory: packages/onnxruntime_dart
        run: dart run ffigen --config ffigen.yaml
      # ffigen produces the raw FFI bindings and nothing else. The wrappers,
      # the WebAssembly bindings, the platform table and the version come from
      # our own generators, and upstream adding a function moves those rather
      # than ffigen's output.
      - working-directory: packages/onnxruntime_dart
        run: |
          dart run tool/generate_bindings.dart
          dart run tool/generate_config_keys.dart
      # GenAI generates the same way and has to be as reproducible: its
      # wrappers come from the pinned header, so a submodule bump nobody
      # regenerated against shows up here rather than at a call site.
      - working-directory: packages/onnxruntime_genai
        run: |
          dart run ffigen --config ffigen.yaml
          dart run tool/generate_bindings.dart
      - name: Generated code must be unchanged
        run: |
          # lib/src/api/ as well as lib/src/bindings/, because that is where
          # the GenAI wrappers and its unmapped.txt live. Covering unmapped.txt
          # is the point: a function upstream adds that the generator cannot
          # map disappears from the API silently otherwise, and this turns that
          # into a failed build with the name in the diff.
          if ! git diff --exit-code --stat -- '*.g.dart' \
                                              packages/*/lib/src/bindings/ \
                                              packages/*/lib/src/api/; then
            echo "::error::Committed generated code differs from a fresh run."
            echo "Run, in packages/onnxruntime_dart:"
            echo "  dart run ffigen --config ffigen.yaml"
            echo "  dart run tool/generate_bindings.dart"
            echo "  dart run tool/generate_config_keys.dart"
            echo "and, in packages/onnxruntime_genai:"
            echo "  dart run ffigen --config ffigen.yaml"
            echo "  dart run tool/generate_bindings.dart"
            exit 1
          fi

  # Stage 1. No native library, so the ABI tests skip. Everything else runs.
  test-web-runtime:
    name: test · web · ${{ matrix.build }} · ${{ matrix.compiler }}
    needs: [mode, build-runtime]
    if: >-
      ${{ !cancelled()
      && (inputs.only == '' || contains(inputs.only, 'web'))
      && (needs.mode.outputs.building != 'true'
          || needs.build-runtime.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The plain build is synchronous; the other two are compiled with
        # Asyncify and take the other backend. All three have to be exercised,
        # and the WebNN one especially: it is the only build with that
        # provider compiled in, so without it here every WebNN test skips with
        # "this build has WebGPU but not WebNN" and the glue this package
        # supplies for it is never run.
        build: [web-wasm, web-wasm-webgpu, web-wasm-webgpu-webnn]
        # Both Dart web compilers. dart2wasm is not a formality here: it is
        # the one that checks what kind of buffer the runtime heap is, and it
        # gives real 64-bit integers, so it takes different paths through the
        # tensor code than dart2js does.
        compiler: [dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-${{ matrix.build }}
          path: .local/artifacts

      - name: Take the runtime from its release
        if: ${{ needs.mode.outputs.building != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/artifacts/runtime
          # Asked for by the publisher's own rule, then put back under the
          # name the build path uses, so every later step is identical whether
          # the archive was built here or fetched from a release.
          asset=$(python3 .github/scripts/rename_release_assets.py \
            --name "${{ matrix.build }}" runtime)
          gh release download "${{ needs.mode.outputs.release }}" \
            --pattern "$asset" --dir .local/artifacts/runtime --clobber
          mv ".local/artifacts/runtime/$asset" \
             ".local/artifacts/runtime/${{ matrix.build }}.tar.gz"

      - name: Serve it to the browser
        shell: bash
        run: |
          set -euo pipefail
          target=packages/onnxruntime_dart/test/web_runtime
          mkdir -p "$target"
          tar xzf ".local/artifacts/runtime/${{ matrix.build }}.tar.gz" -C "$target"
          ls -la "$target"

          loader=$(cd "$target" && ls *.mjs | head -1)
          wasm=$(cd "$target" && ls *.wasm | head -1)
          cat > packages/onnxruntime_dart/test/src/web_runtime_config.dart <<EOF
          // Written by the test-web-runtime job.
          library;

          const webRuntimeLoader = './web_runtime/$loader';
          const webRuntimeWasm = './web_runtime/$wasm';
          EOF
          cat packages/onnxruntime_dart/test/src/web_runtime_config.dart

      # The worker test spawns a script rather than a closure, so its body is
      # its own program and has to exist before the tests run.
      - name: Compile the worker body
        working-directory: packages/onnxruntime_dart
        run: |
          dart compile js test/src/worker_entry.dart \
            -o test/src/worker_entry.dart.js -m

      - working-directory: packages/onnxruntime_dart
        run: dart test -p chrome -c ${{ matrix.compiler }} --reporter expanded

  # Stage 2a. Our binaries, built from the pinned submodule.
  #
  # One pipeline per thing that ships on its own. They share no build
  # directory and no dependency cache, so there is nothing to gain by
  # combining them and one thing to lose: a provider that will not compile
  # taking a runtime down with it, which is what used to happen on iOS.
  #
  # A called workflow cannot request more than its caller grants, and each
  # release job needs to create a release. Without the permission the whole
  # run is rejected before any job starts.
  build-runtime:
    name: build · base
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'runtime')) }}
    uses: ./.github/workflows/build-runtime.yml
    with:
      stream: base
    permissions:
      contents: write

  build-runtime-full:
    name: build · full
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'full')) }}
    uses: ./.github/workflows/build-runtime.yml
    with:
      stream: full
    permissions:
      contents: write

  build-ep-webgpu:
    name: build · webgpu
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'webgpu')) }}
    uses: ./.github/workflows/build-runtime.yml
    with:
      stream: webgpu
    permissions:
      contents: write

  build-ep-qnn:
    name: ep-qnn
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'qnn')) }}
    uses: ./.github/workflows/build-ep-qnn.yml
    permissions:
      contents: write

  build-extensions:
    name: extensions
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'extensions')) }}
    uses: ./.github/workflows/build-extensions.yml
    permissions:
      contents: write

  # Stage 2b. The suite again, this time against the library we actually ship,
  # so the ABI and operator-coverage tests run instead of skipping.
  #
  # The corpus sweep loads all 876 models in the submodule and takes under a
  # second, so it runs here every time. The expensive half is the build, which
  # is cached on the ORT commit and build flags, so a full rebuild and full
  # verification happen exactly when the submodule pin moves.
  # Nothing is compiled: upstream publishes the GenAI library itself and we
  # mirror it, the same arrangement the plugins have. Its own stream because it
  # versions apart from the runtime and keeps working across runtime releases.
  build-genai:
    name: genai
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'genai')) }}
    # The called workflow publishes, so the caller has to grant it. A reusable
    # workflow cannot hold more than the job calling it was given, and without
    # this the whole run fails to start rather than the job failing.
    permissions:
      contents: write
    uses: ./.github/workflows/build-genai.yml

  # Nothing is compiled: ONNX Runtime publishes this plugin itself and we
  # mirror it. Separate from the runtime build because it shares nothing with
  # one, and finishes in minutes rather than hours.
  build-ep-cuda:
    name: ep-cuda
    needs: [static, mode]
    if: >-
      ${{ needs.mode.outputs.building == 'true'
      && (inputs.only == '' || contains(inputs.only, 'cuda')) }}
    uses: ./.github/workflows/build-ep-cuda.yml
    permissions:
      contents: write

  # Stage 2c. The suite on real devices.
  #
  # `dart test` cannot run here: there is no Dart SDK for Android or iOS,
  # `dart compile exe` rejects both, and package:test has no mobile platform.
  # Flutter's integration_test is the only way to execute Dart on a phone, so
  # everything mobile is claimed rather than measured without this job.
  #
  # What it is really for: the execution provider design recovers a library's
  # path by asking the loader where a symbol came from. Android maps libraries
  # out of the APK rather than unpacking them, and iOS repackages each one into
  # a code-signed framework. Neither resembles the desktop layout.
  test-on-device:
    name: test · ${{ matrix.name }} · device
    needs: [mode, build-runtime, build-ep-webgpu]
    # As above: a cancelled build leaves nothing to test against. The device
    # harness installs from releases through the build hook, so it needs no
    # artifacts and runs either way.
    if: >-
      ${{ !cancelled()
      && (inputs.only == '' || contains(inputs.only, 'device'))
      && (needs.mode.outputs.building != 'true'
          || needs.build-runtime.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    # A booted emulator running a handful of tests takes minutes. Without this
    # a hung one ran to the six hour default, twice.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The emulator is x86_64, so that is the library it needs.
          - { name: android-x64, runner: ubuntu-24.04, artifact: android-x86_64, arch: x86_64 }
          # macOS on Apple silicon, because the emulator requires the image
          # and the host to share an architecture. An x64 host does not run an
          # arm64 image slowly, it refuses: "Avd's CPU Architecture 'arm64' is
          # not supported by the QEMU2 emulator on x86_64 host." And of the
          # arm64 hosts, only macOS has an emulator at all: every arm64 host
          # archive in the SDK repository is darwin, with no linux or windows
          # aarch64 build of the emulator, the NDK, or the command line tools.
          # macos-26 rather than macos-15 only because it is the current
          # default. Both report "Apple M1 (Virtual)" and neither has a
          # hypervisor to lend: kern.hv_support is 0 on macos-26 and not even
          # a known sysctl on macos-15. Apple added nested virtualisation with
          # M3, so this waits on GitHub putting newer silicon behind the free
          # labels. The step below measures it rather than assuming.
          #
          # Not ours alone: android-emulator-runner#453 reports the same
          # three dead ends, and #350 and #392 are open on the HVF failure and
          # on this exact arm64-v8a, google_apis, API 34 combination. The
          # answer there is a self-hosted runner, which is infrastructure
          # rather than a workflow change. Point this job at one and it runs.
          #
          # Issue #1 holds the measurements and the upstream links, so this
          # does not get investigated from scratch a second time.
          - { name: android-arm64, runner: macos-26, artifact: android-arm64-v8a, arch: arm64-v8a }
          - { name: ios, runner: macos-15, artifact: ios-sim-arm64 }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-${{ matrix.artifact }}
          path: .local/artifacts

      - name: Unpack the library this device needs
        if: ${{ needs.mode.outputs.building == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ort/device/lib
          tar xzf .local/artifacts/runtime/${{ matrix.artifact }}.tar.gz \
            -C .local/ort/device/lib
          ls -la .local/ort/device/lib

      # The harness is not a workspace member, so it carries its own override.
      # One platform per job, so a single local_build is enough.
      # The provider the harness registers. Its own pipeline, so its own
      # artifact.
      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-${{ matrix.artifact || inputs.configuration || 'ios-sim-arm64' }}-webgpu
          path: .local/artifacts

      - name: Unpack the provider
        if: ${{ needs.mode.outputs.building == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ort/device/lib
          tar xzf ".local/artifacts/ep-webgpu/${{ matrix.artifact || inputs.configuration || 'ios-sim-arm64' }}-webgpu.tar.gz" \
            -C .local/ort/device/lib
          ls -la .local/ort/device/lib

      # Only when testing what this run built. Otherwise the harness
      # resolves through its own build hooks from the published releases,
      # which is the path a user takes and the one worth exercising here.
      - name: Point the harness at it
        if: ${{ needs.mode.outputs.building == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat >> integration/harness/pubspec.yaml <<'YAML'

          hooks:
            user_defines:
              onnxruntime_binaries:
                local_build: ../../.local/ort/device/lib
          YAML
          tail -6 integration/harness/pubspec.yaml

      - name: Set up Java
        if: startsWith(matrix.name, 'android')
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # The runner has KVM but the runner user cannot open it, and the emulator
      # quietly falls back to software emulation rather than saying so. That is
      # the difference between six minutes and six hours.
      # Whether this runner can host a virtual machine at all. The arm64
      # emulator needs the hypervisor and has no software fallback: handed
      # -accel off it still calls hv_vm_create and dies with "HVF error:
      # HV_UNSUPPORTED". kern.hv_support says in one line whether that is the
      # machine refusing or something we are doing wrong, and the alternative
      # is waiting out a boot timeout to learn nothing.
      - name: Can this runner host a hypervisor
        if: matrix.name == 'android-arm64'
        run: |
          hv=$(sysctl -n kern.hv_support 2>&1 || true)
          cpu=$(sysctl -n machdep.cpu.brand_string 2>&1 || true)
          echo "  kern.hv_support: $hv"
          echo "  cpu: $cpu"
          if [ "$hv" != "1" ]; then
            echo "::error::No hypervisor here: kern.hv_support is '$hv' on"
            echo "::error::'$cpu'. Apple silicon exposes nested virtualisation"
            echo "::error::from M3 on, and this runner is virtualised, so the"
            echo "::error::arm64 emulator cannot start. There is no other host"
            echo "::error::to move to: the emulator requires the image and the"
            echo "::error::host to share an architecture, refusing an arm64 AVD"
            echo "::error::on x86_64 outright, and macOS is the only arm64 host"
            echo "::error::Google ships an emulator for at all."
            echo "::error::Real coverage needs arm64 hardware CI does not"
            echo "::error::have. See issue #1 for the measurements.""
            exit 1
          fi

      - name: Let the emulator use KVM
        if: startsWith(matrix.name, 'android') && runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          # Reported, not asserted. udev can take a moment, and failing here
          # would turn a timing wobble into a red job. If KVM really is absent
          # the emulator falls back to software and the job's timeout catches
          # it, which is what the timeout is for.
          if test -w /dev/kvm; then
            echo "kvm is writable"
          else
            echo "::warning::/dev/kvm is not writable; the emulator will run "\
              "in software and will probably exceed this job's timeout"
            # Which of the two it is matters: a missing device means this
            # runner cannot host an emulator at all, a present one means the
            # udev rule did not take. The warning above reads the same either
            # way, so say which.
            ls -l /dev/kvm || echo "::warning::/dev/kvm does not exist on ${{ matrix.runner }}"
          fi

      - name: Run on an Android emulator
        if: startsWith(matrix.name, 'android')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # From the matrix: an arm64-v8a image needs an arm64 host, which is
          # the only way the arm build gets run rather than only built.
          arch: ${{ matrix.arch }}
          target: google_apis
          # Long enough for a software-emulated boot, which is minutes
          # rather than seconds and is the arm64 case above.
          emulator-boot-timeout: 1800
          disable-animations: true
          # Vulkan, not just GLES. swiftshader_indirect gives the emulator a
          # software GL renderer, and ONNX Runtime's WebGPU provider reaches
          # the GPU through Dawn, which wants Vulkan. Without it the provider
          # loads, finds no adapter, and the accelerator goes untested on the
          # architecture most phones actually run.
          # No -accel: auto is the default and is what both of these want.
          # Software emulation was tried for the arm64 image and is not an
          # option: the emulator calls hv_vm_create whatever it is handed. Nor
          # is moving to an x64 host, which refuses a mismatched image
          # outright. The hypervisor step above decides whether this can run.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -feature Vulkan
          working-directory: integration/harness
          script: |
            # What the emulator actually offers, before the tests run. This
            # has now been answered: the image does carry a driver, at
            # /vendor/lib64/hw/vulkan.ranchu.so, and vkjson builds a VkInstance
            # on it, yet ONNX Runtime still reports CPU as the only provider
            # with a device. So the gap is not a missing driver, it is that
            # Dawn will not take the emulator's software Vulkan as an adapter.
            # Kept because it is the evidence for that claim, and the answer
            # would change if the image ever gained a real one.
            adb shell getprop ro.hardware.vulkan || true
            adb shell getprop ro.kernel.qemu.gles || true
            adb shell 'ls /vendor/lib64/hw/vulkan.* 2>/dev/null' || true
            adb shell 'cmd gpu vkjson 2>/dev/null | head -c 400' || true
            flutter test integration_test --reporter expanded

      - name: Run on an iOS simulator
        if: matrix.name == 'ios'
        working-directory: integration/harness
        # Well inside the job's budget, so a hang here reports as this step
        # rather than as the whole job running out of time.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          simulator=$(python3 ../../.github/scripts/pick_simulator.py)
          echo "booting $simulator"
          # bootstatus waits for the boot to finish. Plain boot returns
          # immediately and leaves flutter to race it.
          xcrun simctl bootstatus "$simulator" -b

          # The app builds and installs, then the harness waits for the Dart
          # VM service to connect back. On a headless runner that handshake
          # does not happen unless Simulator.app is actually running, which is
          # how this job spent 39 silent minutes after "Xcode build done".
          open -a Simulator --args -CurrentDeviceUDID "$simulator"
          xcrun simctl bootstatus "$simulator" -b

          # Verbose, so a stall names the phase it stalled in rather than
          # printing nothing at all.
          flutter test integration_test -d "$simulator" \
            --reporter expanded --verbose

      # Whatever the simulator itself logged, which is the only place a crash
      # on launch shows up when the harness just waits.
      # The app launches, prints nothing, and never publishes a VM service,
      # which looks the same whether it crashed on load or simply never got
      # that far. The previous predicate looked for "harness", which is the
      # bundle id; the executable is Runner, so it matched nothing and the
      # failure stayed silent.
      - name: What the simulator logged
        if: failure() && matrix.name == 'ios'
        continue-on-error: true
        run: |
          echo "=== log for the Runner process ==="
          xcrun simctl spawn booted log show --last 10m --style compact \
            --predicate 'processImagePath CONTAINS "Runner"' | tail -80

          echo "=== anything mentioning onnxruntime, dart or the VM service ==="
          xcrun simctl spawn booted log show --last 10m --style compact \
            --predicate 'eventMessage CONTAINS[c] "onnxruntime"
                      OR eventMessage CONTAINS[c] "dart"
                      OR eventMessage CONTAINS[c] "vm service"
                      OR eventMessage CONTAINS[c] "dyld"' | tail -60

          echo "=== crash reports, which is where a failed dlopen lands ==="
          find ~/Library/Logs/DiagnosticReports -name '*.ips' -newermt '-30 minutes' \
            2>/dev/null | head -5 | while read -r report; do
            echo "--- $report"
            head -60 "$report"
          done || echo "no crash reports"

          echo "=== is the library actually in the bundle? ==="
          find integration/harness/build/ios -name 'libonnxruntime*' \
            -o -name 'onnxruntime*.framework' 2>/dev/null | head -5

  # The full runtime is the only one with training compiled in, so it is the
  # only build the training tests can do more than skip against. One platform
  # rather than six: what is being proved is that the API works at all, and
  # that is the same code everywhere. Without this the full stream is built,
  # published, and never loaded.
  test-full-runtime:
    name: test · linux-x64 · full runtime
    needs: [mode, build-runtime-full]
    if: >-
      ${{ !cancelled()
      && (inputs.only == '' || contains(inputs.only, 'full'))
      && (needs.mode.outputs.building != 'true'
          || needs.build-runtime-full.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-linux-x64-full
          path: .local/artifacts

      - name: Take the full runtime from its release
        if: ${{ needs.mode.outputs.building != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .local/artifacts/runtime
          # See the web job: the release publishes full-linux-x64, the build
          # path produces linux-x64-full, and the publisher owns the rule that
          # maps between them.
          asset=$(python3 .github/scripts/rename_release_assets.py \
            --name linux-x64-full runtime)
          gh release download "${{ needs.mode.outputs.release }}" \
            --pattern "$asset" --dir .local/artifacts/runtime --clobber
          mv ".local/artifacts/runtime/$asset" \
             ".local/artifacts/runtime/linux-x64-full.tar.gz"

      - name: Point the suite at the full build
        run: python3 .github/scripts/locate_library.py linux-x64-full

      # After the pubspec names a library; see test-against-our-build.
      - run: dart pub get

      - name: The training tests must actually run
        working-directory: packages/onnxruntime_dart
        run: |
          set -euo pipefail
          # Captured with its status rather than under set -e alone: a
          # failing assignment exits before the echo, so the run that most
          # needs its output is the one that prints none.
          out=$(dart test test/training_test.dart \
            --reporter expanded 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || exit "$status"
          # Any skip, not just the training one. These also skip when the
          # runtime resolved to nothing, and a job that reports success
          # because it tested nothing is the failure mode worth catching.
          # A herestring, not a pipe: `echo | grep -q` returns 141 under
          # pipefail when grep matches early, so the guard would fire only
          # when the string was absent.
          if grep -qi 'skip' <<< "$out"; then
            echo "::error::the training tests skipped on the one build that has"
            echo "::error::training compiled in, so nothing exercised it"
            exit 1
          fi

      - working-directory: packages/onnxruntime_dart
        run: dart test --tags exclusive --concurrency 1 --reporter expanded

  test-against-our-build:
    name: test · ${{ matrix.name }} · our build
    needs: [mode, build-runtime, build-ep-webgpu, build-extensions, build-ep-qnn, build-ep-cuda]
    # Runs even when part of the matrix failed: these six need only their own
    # native artifact, and gating them on every configuration means one web
    # variant that will not link hides whether the libraries we ship work at
    # all. When the builds were skipped entirely there is nothing to wait for,
    # because the binaries are coming from a release instead.
    if: >-
      ${{ !cancelled()
      && (inputs.only == '' || contains(inputs.only, 'desktop'))
      && (needs.mode.outputs.building != 'true'
          || needs.build-runtime.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    # Thirty was enough until Windows on ARM started pulling the 3.8 GB
    # CUDA preview installer to load its plugin against.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     runner: ubuntu-24.04,     artifact: linux-x64 }
          - { name: linux-arm64,   runner: ubuntu-24.04-arm, artifact: linux-arm64 }
          - { name: macos-arm64,   runner: macos-15,         artifact: macos-arm64 }
          - { name: macos-x64,     runner: macos-15-intel,   artifact: macos-x86_64 }
          - { name: windows-x64,   runner: windows-2025,     artifact: windows-x64 }
          - { name: windows-arm64, runner: windows-11-arm,   artifact: windows-arm64 }
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: 3.12.1 }

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-${{ matrix.artifact }}
          path: .local/artifacts

      # Its own pipeline, so its own artifact. Merged into the same tree
      # because locate_library.py reads both out of one place.
      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: onnxruntime-${{ matrix.artifact }}-webgpu
          path: .local/artifacts

      # Mirrored rather than built, and one artifact holds every target, so
      # the one matching this platform is picked out below. Downloaded for the
      # same reason as the others: a provider that is published without
      # anything ever loading it is a provider we do not know works.
      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: ep-qnn
          # Into .local/artifacts, not a subdirectory of it: the mirror uploads
          # dist/, so the archive already carries its own ep-qnn/ folder.
          path: .local/artifacts

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: ep-cuda
          # Into .local/artifacts, not a subdirectory of it: the mirror uploads
          # dist/, so the archive already carries its own ep-cuda/ folder.
          path: .local/artifacts

      # Built by its own pipeline in this run. Without it the extensions tests
      # skip, and a component we publish for thirteen targets would go from
      # built to released with nothing ever loading it.
      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: extensions-${{ matrix.artifact }}
          path: .local/extensions

      # The other side of the switch. Same binaries, same layout, taken from
      # the release instead of from this run.
      - name: Take the binaries from their release
        if: ${{ needs.mode.outputs.building != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/fetch_release_binaries.py \
            "${{ matrix.artifact }}" --runtime-tag "${{ needs.mode.outputs.release }}"

      - name: Unpack the operator library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ort-extensions
          tar xzf ".local/extensions/extensions-${{ matrix.artifact }}.tar.gz" \
            -C .local/ort-extensions
          ls -la .local/ort-extensions

      # Dawn reaches the GPU through Vulkan on Linux, and a hosted runner has
      # neither a GPU nor a Vulkan driver, so the WebGPU provider loads and
      # then finds no adapter. lavapipe is Mesa's software implementation:
      # slow, and enough to make the provider genuinely testable rather than
      # something we skip and hope about.
      - name: A Vulkan driver for the WebGPU provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary 2>/dev/null | head -20 || true

      # The CUDA plugin dlopens libcudart, so without it the library cannot
      # be loaded at all and the load test proves nothing. Only the cudart
      # sub-package, which is a few tens of megabytes rather than the whole
      # toolkit: nothing here compiles CUDA, it only needs the runtime present
      # so the plugin resolves. Inference needs a GPU this runner does not
      # have, and the accelerator tests exclude it for that reason.
      # Split by platform because the installers do not agree on names: the
      # Linux packages are cudart, cudart-dev and libcublas, and the Windows
      # installer has no cudart-dev at all and calls the other one cublas.
      - name: The CUDA runtime, so its plugin can be loaded (Linux)
        # Both architectures: NVIDIA publishes CUDA for aarch64 as sbsa, and we
        # publish a CUDA plugin for linux-arm64, so not installing it there
        # would leave a shipped plugin with nothing ever loading it.
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.0.2'
          method: network
          # cudart-dev as well, because that is the package carrying
          # lib64/stubs/libcuda.so, which the next step needs.
          sub-packages: '["cudart", "cudart-dev"]'
          non-cuda-sub-packages: '["libcublas"]'

      - name: The CUDA runtime, so its plugin can be loaded (Windows)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.0.2'
          method: network
          sub-packages: '["cudart", "cublas"]'

      - name: The driver stub, so the CUDA plugin can be loaded
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Searched rather than assumed: the network install lays the stub out
          # per version and only some layouts have lib64/stubs.
          stub=$(find "${CUDA_PATH:-/usr/local}" /usr/local/cuda* \
            -name 'libcuda.so*' -path '*stub*' 2>/dev/null | head -1)
          if [ -z "$stub" ]; then
            echo "::warning::no libcuda stub found; the CUDA plugin will not load"
            find "${CUDA_PATH:-/usr/local}" -maxdepth 3 -name 'lib*' -type d 2>/dev/null | head -10
            exit 0
          fi
          dir=$(dirname "$stub")
          ls "$dir"
          # dlopen looks for libcuda.so.1, and the stub is named libcuda.so.
          if [ ! -e "$dir/libcuda.so.1" ]; then
            sudo ln -sf "$dir/libcuda.so" "$dir/libcuda.so.1"
          fi
          echo "LD_LIBRARY_PATH=$dir:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Dawn reaches the GPU through D3D12 on Windows and compiles shaders
      # with the DirectX Shader Compiler, which it dlopens by name. The runner
      # image does not carry dxil.dll or dxcompiler.dll, so the provider loads
      # and then fails the first time it needs to compile one. Worth knowing
      # beyond CI: an application shipping this provider on Windows needs both
      # DLLs beside it.
      #
      # Two sources, because no single one covers both architectures.
      #
      # x64 takes the upstream release, which is what this provider is known
      # to work against. ARM64 cannot: every current DXC distribution ships
      # ARM64EC under bin/arm64, not ARM64. The PE header says AMD64, the load
      # config carries a CHPE pointer, and there is no ARM64X relocation
      # table, so a native ARM64 process refuses it and LoadLibrary fails with
      # error 87. That is true of the GitHub release and of the matching
      # Microsoft.Direct3D.DXC package alike, byte for byte.
      #
      # What is left is the Windows SDK, which does ship a native ARM64 build.
      # Newest first, because Dawn wants a recent compiler and the SDK keeps
      # every version ever installed: 10.0.26100.0 carries DXC 1.8.2502 and
      # works, while 10.0.22621.0 carries 1.6.2112, which loads cleanly and
      # then kills the process with exit 127 and nothing logged.
      - name: The DirectX shader compiler, for the WebGPU provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-Machine($path) {
            try {
              $bytes = [IO.File]::ReadAllBytes($path)
              $at = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
              switch ($at) { 0xaa64 { 'ARM64' } 0x8664 { 'AMD64' } 0x14c { 'X86' } default { "$at" } }
            } catch { 'unreadable' }
          }

          $onArm = $env:RUNNER_ARCH -eq 'ARM64'
          $want = if ($onArm) { 'ARM64' } else { 'AMD64' }
          $chosen = $null

          if ($onArm) {
            $roots = @(
              "C:\Program Files (x86)\Windows Kits\10\bin",
              "C:\Program Files\Windows Kits\10\bin"
            ) | Where-Object { Test-Path $_ }
            Write-Host "  shader compilers this image carries:"
            # Matched rather than cast: a FileVersion can be missing or carry
            # a build tag, and a cast that throws on one file takes the whole
            # step down under ErrorActionPreference.
            $all = Get-ChildItem $roots -Recurse -Filter dxcompiler.dll -ErrorAction SilentlyContinue |
              Sort-Object {
                if ($_.VersionInfo.FileVersion -match '\d+(\.\d+){1,3}') {
                  [version]$Matches[0]
                } else { [version]'0.0' }
              } -Descending
            foreach ($found in $all) {
              $machine = Get-Machine $found.FullName
              # dxil.dll is the validator and has to sit beside it, or the
              # compiler loads and then signs nothing it produces.
              $paired = Test-Path (Join-Path $found.Directory 'dxil.dll')
              Write-Host "    $machine  $($found.VersionInfo.FileVersion)  dxil: $paired  $($found.FullName)"
              if (-not $chosen -and $machine -eq $want -and $paired) { $chosen = $found }
            }
            if (-not $chosen) {
              throw "no native ARM64 shader compiler on this image, and every " +
                    "DXC distribution ships ARM64EC, which cannot be loaded here"
            }
          } else {
            $asset = (Invoke-RestMethod `
              https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest
            ).assets | Where-Object { $_.name -like 'dxc_*.zip' } | Select-Object -First 1
            Write-Host "  $($asset.browser_download_url)"
            Invoke-WebRequest $asset.browser_download_url -OutFile dxc.zip
            # PowerShell rather than unzip: the archive stores backslash
            # separators, which Git Bash turns into filenames containing
            # backslashes rather than directories.
            Expand-Archive dxc.zip -DestinationPath .local/dxc -Force
            $chosen = Get-ChildItem .local/dxc -Recurse -Filter dxcompiler.dll |
              Where-Object { $_.FullName -like '*\x64\*' } | Select-Object -First 1
            if (-not $chosen) { throw "no x64 dxcompiler.dll in $($asset.name)" }
          }

          # Read out of the PE header rather than trusted from the path. This
          # is the check that would have caught the ARM64EC build at once
          # instead of as an unexplained error number inside Dawn.
          $machine = Get-Machine $chosen.FullName
          Write-Host "  using $($chosen.Directory), which is $machine"
          if ($machine -ne $want) { throw "dxcompiler.dll is $machine, need $want" }

          # Read by the step that puts these beside the plugin, so that one
          # does not have to guess where they came from.
          Add-Content $env:GITHUB_ENV "DXC_DIR=$($chosen.Directory.FullName)"
          Add-Content $env:GITHUB_PATH $chosen.Directory.FullName

      # Windows on ARM has CUDA only as a developer preview, which the toolkit
      # action does not know about, so it is fetched by hand. The provider
      # imports cublas64_13.dll and cublasLt64_13.dll, and those are all we
      # need: extracted from the installer rather than installed, because we
      # want two libraries next to a plugin, not a toolchain and a driver.
      #
      # CUDA 13 is the only toolkit that exists for ARM at all, which is why
      # the matrix offers no cuda12 there.
      - name: The CUDA preview libraries, for Windows on ARM
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          function Get-Machine($path) {
            try {
              $bytes = [IO.File]::ReadAllBytes($path)
              $at = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
              switch ($at) { 0xaa64 { 'ARM64' } 0x8664 { 'AMD64' } 0x14c { 'X86' } default { "$at" } }
            } catch { 'unreadable' }
          }

          $url = 'https://packages.nvidia.com/prerelease/cuda/13.4.0/' +
                 'local_installers/cuda_13.4.0_windows_arm64.exe'
          Write-Host "  $url"
          # Invoke-WebRequest rather than curl.exe. curl is faster on files
          # this size, and it was tried, but this host closes the connection
          # on it at once: "curl: (18) end of response with 3810773240 bytes
          # missing", before a single byte arrives. The cmdlet fetches the
          # whole 3.8 GB without complaint, so it is the one that works.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest $url -OutFile cuda.exe
          Write-Host "  $([int]((Get-Item cuda.exe).Length/1MB)) MB"

          # The installer is a 7-Zip self-extractor, so the libraries can be
          # taken out of it without running it. Running it would want a driver
          # and a reboot, and a hosted runner has no NVIDIA card to drive.
          #
          # `e` with names rather than `x`, because unpacking the whole 3.8 GB
          # installer onto a runner that has about 14 GB free is how a job
          # fails on disk space instead of on the thing it was testing.
          $wanted = 'cublas64_13.dll', 'cublasLt64_13.dll', 'cudart64_13.dll'
          New-Item -ItemType Directory -Force .local/cuda-unpack, .local/cuda-lib > $null
          $unpack = (Resolve-Path .local/cuda-unpack).Path
          $into = (Resolve-Path .local/cuda-lib).Path

          # `x` and not `e`: the Windows ARM installer carries x64 copies of
          # these libraries as well, for cross compilation, and flattening the
          # tree lets one overwrite the other. Which one you get is then down
          # to extraction order, and an x64 cublas beside an ARM64 plugin
          # fails as error 193, "not a valid Win32 application".
          #
          # $wanted rather than @wanted: PowerShell expands both, but 7z reads
          # a leading @ as "this names a list file" and would look for one.
          & 7z x cuda.exe "-o$unpack" -y -r $wanted > $null
          if ($LASTEXITCODE -ne 0) { throw "7z could not read the installer" }

          $found = Get-ChildItem $unpack -Include $wanted -Recurse -ErrorAction SilentlyContinue
          if (-not $found) {
            # Before giving up, say what the installer does hold. If these
            # libraries turn out to sit inside a nested archive, this is the
            # listing that says so, and the alternative is another whole run
            # spent finding out.
            Write-Host "  no $($wanted -join ', '); the installer holds:"
            & 7z l cuda.exe | Select-String -Pattern '\.dll$' |
              Select-Object -First 40 | ForEach-Object { Write-Host "    $_" }
            throw "none of $($wanted -join ', ') in the installer"
          }

          # Chosen by what each file is, not by where it sits. Reading the PE
          # header is the only thing that tells an ARM64 build from an x64 one
          # with the same name.
          foreach ($name in $wanted) {
            $copies = @($found | Where-Object Name -eq $name)
            $native = $copies | Where-Object { (Get-Machine $_.FullName) -eq 'ARM64' } |
              Select-Object -First 1
            foreach ($c in $copies) {
              Write-Host "    $(Get-Machine $c.FullName)  $($c.FullName.Substring($unpack.Length))"
            }
            if (-not $native) { throw "no ARM64 $name in the installer" }
            Copy-Item $native.FullName $into -Force
            Write-Host "  $name  $([int]($native.Length/1MB)) MB"
          }
          # Only once it is known to have yielded what was wanted.
          Remove-Item cuda.exe -Force
          Remove-Item $unpack -Recurse -Force
          Add-Content $env:GITHUB_ENV "CUDA_LIB_DIR=$into"

      # GenAI is mirrored rather than built, and published for fewer targets
      # than the runtime: no macOS x64. A target it has no build for says so
      # and carries on.
      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.building == 'true' }}
        with:
          name: genai
          path: .local/artifacts
        continue-on-error: true

      - name: Stage the GenAI library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/locate_genai.py "${{ matrix.artifact }}"

      - name: Point the suite at our build
        shell: bash
        run: |
          set -euo pipefail
          # The providers this job staged, which is what may be required. CUDA
          # is not among them on Windows ARM, where its runtime cannot exist.
          required="webgpu qnn cuda"
          python3 .github/scripts/locate_library.py "${{ matrix.artifact }}" $required

      # Beside the plugin, and also on PATH from the step above. Placing them
      # next to the provider is what made this work on x64, and it is what an
      # application shipping the provider has to do anyway, so that is what is
      # exercised here. Whether PATH alone would now suffice is untested: the
      # error 87 chased at length on ARM64 turned out to be an ARM64EC binary
      # rather than anything to do with where it sat.
      - name: Put the dependent DLLs beside the plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $webgpu = Get-ChildItem .local/ort -Recurse `
            -Filter onnxruntime_providers_webgpu.dll | Select-Object -First 1
          if ($webgpu) {
            # The directory the step above settled on, rather than a second
            # search that could pick a different copy than the one it checked.
            foreach ($name in 'dxcompiler.dll', 'dxil.dll') {
              $source = Join-Path $env:DXC_DIR $name
              if (-not (Test-Path $source)) { throw "$name is not in $env:DXC_DIR" }
              Copy-Item $source $webgpu.Directory -Force
              Write-Host "  $name -> $($webgpu.Directory)"
            }
          }

          $cuda = Get-ChildItem .local/ort -Recurse `
            -Filter onnxruntime_providers_cuda.dll | Select-Object -First 1
          # CUDA_LIB_DIR is the ARM64 path, where the libraries were taken
          # out of the preview installer rather than installed by the toolkit
          # action. Either way what follows wants one directory to copy from.
          $cudaFrom = if ($env:CUDA_LIB_DIR) { $env:CUDA_LIB_DIR } else { $env:CUDA_PATH }
          if ($cuda -and $cudaFrom) {
            # Searched rather than assumed: the silent installer does not
            # always lay the runtime DLLs out under bin, and a glob that
            # matches nothing copies nothing and says nothing.
            $dlls = Get-ChildItem $cudaFrom -Recurse -Include `
              cudart64_*.dll, cublas64_*.dll, cublasLt64_*.dll -ErrorAction SilentlyContinue
            if (-not $dlls) {
              Write-Host "::warning::no CUDA runtime DLLs under $cudaFrom"
              Get-ChildItem $cudaFrom -Directory |
                ForEach-Object { Write-Host "  dir: $($_.Name)" }
            }
            $dlls | ForEach-Object {
              Copy-Item $_.FullName $cuda.Directory -Force
              Write-Host "  $($_.Name) -> $($cuda.Directory)"
            }
          }

      # After the pubspec names a library, never before. The build hook reads
      # user_defines when it resolves, so resolving first leaves it with
      # nothing and every test that needs the runtime skips while the job
      # reports success.
      - run: dart pub get

      - name: Test
        shell: bash
        working-directory: packages/onnxruntime_dart
        run: dart test --exclude-tags exclusive --reporter expanded

      # A suite that skipped for want of a runtime has tested nothing and
      # reports the same green as one that tested everything. This job exists
      # to prove the binaries work, so failing to load them is a failure here,
      # not a reason to pass quietly.
      - name: Test (exclusive)
        working-directory: packages/onnxruntime_dart
        shell: bash
        run: |
          set -euo pipefail
          # Training is excluded, not skipped: this is the base build, which
          # has none compiled in, and a skip here would read the same as a
          # runtime that failed to load. test-full-runtime runs them.
          out=$(dart test --tags exclusive --exclude-tags training \
            --concurrency 1 --reporter expanded 2>&1) && status=0 || status=$?
          echo "$out"
          # See above: a pipe here inverts the test under pipefail.
          if grep -q 'supplied no native library' <<< "$out"; then
            echo "::error::the native asset did not load, so every test that"
            echo "::error::exercises the runtime skipped. Reason reported:"
            grep -m1 'supplied no native library' <<< "$out" || true
            exit 1
          fi
          exit $status

      # The ABI tests skip silently when no library is found, which would make
      # this whole job pass while proving nothing.
      - name: The ABI tests must have run
        working-directory: packages/onnxruntime_dart
        shell: bash
        run: |
          set -euo pipefail
          # See the training step: capture the status too, or a failure exits
          # before its own output is printed.
          out=$(dart test test/bindings_test.dart \
            --reporter expanded 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -eq 0 ] || exit "$status"
          # A herestring, not a pipe: `echo | grep -q` returns 141 under
          # pipefail when grep matches early, so the guard would fire only
          # when the string was absent.
          if grep -qi 'skip' <<< "$out"; then
            echo "::error::bindings_test skipped. Our build was not found."
            exit 1
          fi

      # The GenAI suite, in its own package and so its own invocation. It skips
      # with a named reason on a target upstream publishes no library for,
      # which is macOS x64 and nothing else.
      - name: Test GenAI
        # Only where upstream has a build. Elsewhere the hook refuses, which is
        # the right answer for an application and the wrong one for a job that
        # should just not run these.
        if: env.GENAI_SUPPORTED == 'true'
        working-directory: packages/onnxruntime_genai
        run: dart test --reporter expanded
