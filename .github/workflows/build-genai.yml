# Publishes ONNX Runtime GenAI.
#
# Nothing is compiled here. Upstream builds and publishes the library for every
# target it supports, so this mirrors their release into ours under our own
# naming, and the build hook installs it the same way as everything else. The
# same arrangement the CUDA and QNN plugins have, and for the same reason.
#
# GenAI versions separately from the runtime and keeps working across runtime
# releases, because it resolves `OrtGetApiBase` out of whatever runtime is
# loaded rather than linking one. So it is its own release stream.
name: build-genai

on:
  # Called by ci.yml, which is the only entry point. Building on its own would
  # be building without testing what was built.
  workflow_call:
permissions:
  contents: read

concurrency:
  group: build-genai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror the GenAI library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Fetch and repackage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fetch_genai.py

      - uses: actions/upload-artifact@v4
        with:
          name: genai
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Publish or refresh the release
        # Tags only. Landing on main builds and tests it; publishing is a
        # separate decision, as it is for every other component.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_genai.py
