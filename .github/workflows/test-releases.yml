# Runs the suite against what is published, without building anything.
#
# The main pipeline builds and then tests what it built, which is right for a
# change to the runtime and wasteful for everything else: the web builds alone
# are around forty minutes each, and the WebNN one closer to two hours. This
# takes the same binaries from their releases instead, so a change to the Dart
# side can be tested in minutes against exactly what a user would install.
#
# It follows rather than replaces the build pipeline. If a release is missing
# or does not hold a configuration it claims, this fails loudly instead of
# skipping, because a published release that cannot be installed is the failure
# worth catching here.
name: releases

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: Runtime release to test, or empty for the pinned one
        type: string
        default: ''
  schedule:
    # Weekly, so a release that stops installing is noticed without waiting for
    # someone to push.
    - cron: '0 6 * * 1'

concurrency:
  group: releases-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: releases · ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04, config: linux-x64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, config: linux-arm64 }
          - { name: macos-arm64, runner: macos-15, config: macos-arm64 }
          - { name: macos-x64, runner: macos-15-intel, config: macos-x86_64 }
          - { name: windows-x64, runner: windows-2025, config: windows-x64 }
          - { name: windows-arm64, runner: windows-11-arm, config: windows-arm64 }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Take the binaries from their releases
        run: |
          python3 .github/scripts/fetch_release_binaries.py "${{ matrix.config }}" \
            ${{ inputs.runtime_tag && format('--runtime-tag {0}', inputs.runtime_tag) || '' }}

      # Downloaded as an archive, and the tests want it unpacked, in the one
      # place locate_library.py looks.
      - name: Unpack the operator library
        run: |
          set -euo pipefail
          archive=".local/extensions/extensions-${{ matrix.config }}.tar.gz"
          if [ -f "$archive" ]; then
            mkdir -p .local/ort-extensions
            tar xzf "$archive" -C .local/ort-extensions
            ls -la .local/ort-extensions
          else
            echo "no extensions archive for ${{ matrix.config }}; those tests will skip"
          fi

      - name: Point the suite at them
        run: |
          # Every provider published for this target was fetched above,
          # so a missing one here is a broken release rather than a
          # reason to skip.
          python3 .github/scripts/locate_library.py "${{ matrix.config }}" \
            webgpu cuda qnn

      - run: dart test packages/onnxruntime_dart --exclude-tags exclusive --reporter expanded
      - run: dart test packages/onnxruntime_dart --tags exclusive --concurrency 1 --reporter expanded

  web:
    name: releases · web · ${{ matrix.build }} · ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every published web build, including the WebNN one, which the main
        # pipeline builds and then never tests because waiting two hours for it
        # is what this workflow exists to avoid.
        build:
          - web-wasm
          - web-wasm-webgpu
          - web-wasm-webgpu-webnn
        compiler: [dart2js, dart2wasm]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Take the runtime from its release
        run: |
          set -euo pipefail
          tag="${{ inputs.runtime_tag }}"
          if [ -z "$tag" ]; then
            tag=$(python3 -c "
          import sys; sys.path.insert(0, '.github/scripts')
          import release_identity
          print(release_identity.release_tag('runtime'))
          ")
          fi
          echo "taking ${{ matrix.build }} from $tag"
          mkdir -p .local/artifacts/runtime
          gh release download "$tag" \
            --pattern "${{ matrix.build }}.tar.gz" \
            --dir .local/artifacts/runtime --clobber

      - name: Serve it to the browser
        run: |
          set -euo pipefail
          target=packages/onnxruntime_dart/test/web_runtime
          mkdir -p "$target"
          tar xzf ".local/artifacts/runtime/${{ matrix.build }}.tar.gz" -C "$target"

          loader=$(cd "$target" && ls *.mjs | head -1)
          wasm=$(cd "$target" && ls *.wasm | head -1)
          cat > packages/onnxruntime_dart/test/src/web_runtime_config.dart <<EOF
          // Written by the releases workflow.
          library;

          const webRuntimeLoader = './web_runtime/$loader';
          const webRuntimeWasm = './web_runtime/$wasm';
          EOF

      - name: Compile the worker body
        working-directory: packages/onnxruntime_dart
        run: |
          dart compile js test/src/worker_entry.dart \
            -o test/src/worker_entry.dart.js -m

      - working-directory: packages/onnxruntime_dart
        run: dart test -p chrome -c ${{ matrix.compiler }} --reporter expanded
