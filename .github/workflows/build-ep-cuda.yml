# Publishes the CUDA execution provider.
#
# Nothing is compiled here. ONNX Runtime builds and publishes this plugin
# itself, and building it ourselves is not realistic on free runners: Microsoft
# budgets 240 minutes on Linux and 360 on Windows against a six hour ceiling on
# four cores, and a Windows runner has 14 GB of disk against a 2.3 GB toolkit.
#
# So this mirrors their release into ours, under our own naming, so the build
# hook installs it the same way as everything else. The plugin negotiates its
# API version at load and works against any runtime from its declared minimum
# onwards, which is why it is versioned and released separately.
#
# It is a separate workflow because it shares nothing with a runtime build: no
# toolchain, no submodule compile, no matrix. It finishes in minutes.
name: build-ep-cuda

on:
  # Called by ci.yml, which is the only entry point. Building on its own
  # would be building without testing what was built.
  workflow_call:
permissions:
  contents: read

concurrency:
  group: build-ep-cuda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror the CUDA plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Fetch and repackage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fetch_provider.py cuda

      - uses: actions/upload-artifact@v4
        with:
          name: ep-cuda
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Publish or refresh the release
        # Only from main. dev builds to prove it works, not to publish.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_provider.py cuda
