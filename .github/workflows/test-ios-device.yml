# Runs the harness on an iOS simulator, on its own.
#
# Exists because this is the one job that has never completed: every attempt in
# ci was either cancelled by a push or skipped because its build was. Its own
# workflow means its own concurrency group, so pushing to main while it runs
# cannot disturb it.
#
# Builds what it needs rather than reaching into another run's artifacts, so it
# is self-contained and can be dispatched at any time.
name: test-ios-device

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Which iOS configuration to build and test on'
        type: string
        default: ios-sim-arm64

permissions:
  contents: read

concurrency:
  group: test-ios-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ inputs.configuration || 'ios-sim-arm64' }}
    uses: ./.github/workflows/build-runtime.yml
    with:
      stream: base
      configurations: ${{ inputs.configuration || 'ios-sim-arm64' }}
    permissions:
      contents: write

  provider:
    name: build the webgpu provider
    uses: ./.github/workflows/build-runtime.yml
    with:
      stream: webgpu
      configurations: ${{ inputs.configuration || 'ios-sim-arm64' }}-webgpu
    permissions:
      contents: write

  test:
    name: harness on a simulator
    needs: [build, provider]
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-${{ inputs.configuration || 'ios-sim-arm64' }}
          path: .local/artifacts

      - name: Unpack the library this device needs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ort/device/lib
          tar xzf ".local/artifacts/runtime/${{ inputs.configuration || 'ios-sim-arm64' }}.tar.gz" \
            -C .local/ort/device/lib
          ls -la .local/ort/device/lib

      # The provider the harness registers. Its own pipeline, so its own
      # artifact.
      - uses: actions/download-artifact@v4
        with:
          name: onnxruntime-${{ matrix.artifact || inputs.configuration || 'ios-sim-arm64' }}-webgpu
          path: .local/artifacts

      - name: Unpack the provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ort/device/lib
          tar xzf ".local/artifacts/ep-webgpu/${{ matrix.artifact || inputs.configuration || 'ios-sim-arm64' }}-webgpu.tar.gz" \
            -C .local/ort/device/lib
          ls -la .local/ort/device/lib

      - name: Point the harness at it
        shell: bash
        run: |
          set -euo pipefail
          cat >> integration/harness/pubspec.yaml <<'EOF'

          hooks:
            user_defines:
              onnxruntime_binaries:
                local_build: ../../.local/ort/device/lib
          EOF

      - name: Run on an iOS simulator
        working-directory: integration/harness
        timeout-minutes: 25
        run: |
          set -euo pipefail
          simulator=$(python3 ../../.github/scripts/pick_simulator.py)
          echo "booting $simulator"
          xcrun simctl bootstatus "$simulator" -b
          # The app installs and launches, then the harness waits for the Dart
          # VM service to connect back. On a headless runner that handshake
          # needs Simulator.app actually running.
          open -a Simulator --args -CurrentDeviceUDID "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          flutter test integration_test -d "$simulator" \
            --reporter expanded --verbose

      - name: What the simulator logged
        if: failure()
        continue-on-error: true
        run: |
          xcrun simctl spawn booted log show --last 10m --style compact \
            --predicate 'processImagePath CONTAINS "harness"' | tail -80
